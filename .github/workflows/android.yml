name: Android CI

on:
  push:
  pull_request:
  repository_dispatch:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          java-package: jdk

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools platforms;android-37.2 build-tools;37.0.0
            ndk;30.0.16248370 cmake;4.1.2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: generate-and-submit

      - name: Build APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease -x test -x lint -x lintVitalRelease --build-cache

      - name: Collect packages
        run: |
          mkdir -p ci-output
          cp app/build/outputs/apk/release/app-release.apk ci-output/LvTu-arm64-v8a.apk
          cp app/build/outputs/bundle/release/app-release.aab ci-output/LvTu.aab

      - name: Upload APK without ZIP wrapping
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/LvTu-arm64-v8a.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB without ZIP wrapping
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/LvTu.aab
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" ci-output/* --verify-tag --generate-notes

      - name: Delete workflow runs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 3
          keep_minimum_runs: 2
